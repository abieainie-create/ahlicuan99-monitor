name: Blogspot website monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: blogspot-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ahlicuan99-dashboard
          workload_identity_provider: projects/441269398422/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ahlicuan99-dashboard@ahlicuan99-dashboard.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Blogspot pages
        id: monitor
        continue-on-error: true
        run: npm run monitor
        env:
          TARGET_URL: https://ahlicuan99.blogspot.com/
          MAX_PAGES: "12"

      - name: Run technical SEO audit
        id: seo
        continue-on-error: true
        run: npm run seo-audit
        env:
          TARGET_URL: https://ahlicuan99.blogspot.com/
          SEO_MAX_PAGES: "20"

      - name: Collect Google Analytics and Search Console data
        id: google-data
        continue-on-error: true
        run: node google-data.js
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SEARCH_CONSOLE_SITE_URL: https://ahlicuan99.blogspot.com/

      - name: Save dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/history.json
          if [ -f docs/seo.json ]; then git add docs/seo.json; fi
          if [ -f docs/google-data.json ]; then git add docs/google-data.json; fi
          if git diff --cached --quiet; then
            echo "No dashboard changes to save"
          else
            git commit -m "Update website monitoring dashboard"
            git push
          fi

      - name: Report monitoring issues without failing the workflow
        if: always()
        run: |
          if [ "${{ steps.monitor.outcome }}" = "failure" ]; then
            echo "::warning::Website check found issues. Inspect HTTP statuses in the saved dashboard."
          fi
          if [ "${{ steps.google-data.outcome }}" = "failure" ]; then
            echo "::warning::Google data collection encountered an error. Other monitoring results are retained."
          fi
