name: Blogspot website monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogspot-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Blogspot pages
        id: monitor
        continue-on-error: true
        run: npm run monitor
        env:
          TARGET_URL: https://ahlicuan99.blogspot.com/
          MAX_PAGES: "12"

      - name: Run technical SEO audit
        id: seo
        continue-on-error: true
        run: npm run seo-audit
        env:
          TARGET_URL: https://ahlicuan99.blogspot.com/
          SEO_MAX_PAGES: "20"

      - name: Save dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/history.json
          if [ -f docs/seo.json ]; then git add docs/seo.json; fi
          if git diff --cached --quiet; then
            echo "No dashboard changes to save"
          else
            git commit -m "Update website monitoring dashboard"
            git push
          fi

      - name: Mark failed website check
        if: steps.monitor.outcome == 'failure'
        run: exit 1
